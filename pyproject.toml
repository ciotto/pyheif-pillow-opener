[build-system]
requires = [
    "setuptools>=61",
    "cffi>=1.15.1",
    "libheif-binary==1.17.6.2; sys_platform == 'linux' or sys_platform == 'darwin'",
]
build-backend = "setuptools.build_meta"

[project]
name = "heif-image-plugin"
version = "0.8.1"
description = "A HEIF/HEIC and AVIF plugin for Pillow based on libheif."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Alexander Karpinsky", email = "homm86@gmail.com" },
]
keywords = ["heif", "heic", "Pillow", "plugin", "libheif"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "cffi>=1.15.1",
    "piexif>=1.1.3",
]

[project.optional-dependencies]
libheif = [
    # When updating the minimum libheif version, also check:
    # pyproject.toml: build-system.requires pins the build dependency.
    # _heif_image_plugin/_native.py: MIN_VERSION and INSTALL_HINT.
    # Dockerfile: system libheif version in the base image.
    # README.md: minimum supported version.
    "libheif-binary>=1.17.6.2"
]

[project.urls]
Homepage = "https://github.com/uploadcare/heif-image-plugin"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "isort>=6.0.0",
    "flake8>=7.0.0",
]
dev-pillow-latest = [
    { include-group = "dev" },
    "pillow>=10.0.1",
]
dev-pillow-prod = [
    { include-group = "dev" },
    "pillow @ file:./pip-stubs/pillow",
    # branch: simd/12.3.x-prod
    "pillow-simd @ git+https://github.com/uploadcare/pillow-simd.git@b4c33a96e58e1896c36fed40e759eed0ab5bab4d",
]

[tool.setuptools]
py-modules = ["HeifImagePlugin"]
packages = ["_heif_image_plugin"]
